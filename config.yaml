# =====================================================================
# RotomArena Benchmark Configuration
# =====================================================================

server:
  host: "127.0.0.1"   # Showdown also binds to this address
  port: 8000
  websocket_path: "/showdown/websocket"
  action_path: "/action.php?"
  no_security: true
  auto_start: true
  engine: "simulator"   # from c5: games in Showdown's simulator, no chat server (AGENTS.md)

# Rules shared by every player of a version. They are recorded in every match; changing any of them needs a new
# version id.
# The version the ladder and draft commands play unless given --version. Every version that can be played is under
# rulesets, by its version id; a version id names exact rules, stored in data/rulesets/<version>.json on its first run.
play: "c5"

rulesets:
  s4:
    # Rotom Gen9 Bench: Gen 9 OU with each model's own team, drafted in two stages, and the same thinking budget for
    # every model. Earlier versions: "s3" (two-stage drafts, effort-level thinking; no games), "s2" (own teams,
    # one-step draft, retired) and "s1" (team_mode "fixed", placement paused on 8 Oct).
    team_mode: "draft"
    # ladder: models think (OpenRouter "medium" effort), 4,096 tokens per turn in total (thinking included;
    #         local servers stop thinking at half), 2-hour hang guard
    # concise: no hidden thinking, 1,024 tokens, 15-minute guard (fast games for videos and quick tests)
    # Any of reasoning / max_output_tokens / turn_timeout set here overrides the profile.
    profile: "ladder"
    # Every model thinks at most 1,024 tokens per turn (OpenRouter reasoning.max_tokens, llama.cpp --reasoning-budget),
    # then answers within the remaining 1,024: reaching the budget ends the thinking, not the answer.
    thinking_budget: 1024
    max_output_tokens: 2048
    # Drafting writes six full sets in one answer, which needs more than a battle turn's 1,024 answer tokens: the same
    # 1,024 tokens of thinking, then up to 4,096 for the team.
    draft_max_output_tokens: 5120
    teams: ["balance", "hyper_offense"]   # fixed mode: every ladder set plays both, from both sides
    # Meta's endpoint ignores reasoning.max_tokens (asked for 1,024, Muse thought 2,045 and was cut off on 24 of 53
    # turns); it does follow effort levels, and "minimal" (~335 tokens) is the strongest that stays within 1,024.
    thinking_exceptions:
      muse_spark_1_3: "minimal"

  # Rotom Champ Bench: Pokémon Champions Battle Stadium Singles, Regulation M-B (level 50, bring 6 pick 3, Item
  # Clause, Stat Points, Mega Evolution), each model playing the team it built; one game, no timer (our copy of the
  # format, in server/custom_formats.js). The same thinking budget as s4.
  c1:   # retired 10 Oct: its battle prompt didn't say the Pokémon are level 50, and DeepSeek wasn't routed (see c2)
    format: "gen9championsrotomarenabssregmb"
    team_mode: "draft"
    pick: 3
    profile: "ladder"
    thinking_budget: 1024
    max_output_tokens: 2048
    draft_max_output_tokens: 5120
    thinking_exceptions:
      muse_spark_1_3: "minimal"

  # Rotom Champ Bench as played now: c1's rules, plus the battle prompt names the format and states that every
  # Pokémon is level 50 (models did their damage math at level 100), and DeepSeek V4.1 Flash is served only by the
  # OpenRouter providers that enforce the thinking budget (measured 10 Oct: these four thought 365-651 tokens on a
  # heavy team preview; DeepSeek's own, Parasail, Baidu and SiliconFlow ran to the 2,048 cap every time).
  c2:   # retired 10 Oct: models could not Mega Evolve, and the bench listed the Pokémon left at home (see c3)
    format: "gen9championsrotomarenabssregmb"
    team_mode: "draft"
    pick: 3
    profile: "ladder"
    thinking_budget: 1024
    max_output_tokens: 2048
    draft_max_output_tokens: 5120
    thinking_exceptions:
      muse_spark_1_3: "minimal"
    provider_routing:
      deepseek_v4_1_flash: ["Fireworks", "Novita", "DeepInfra", "Together"]

  # Rotom Champ Bench as played now: c2's rules, plus Mega Evolution is a legal action ("MOVE: x [MEGA]"; in c1-c2
  # only the random bot could Mega Evolve, so the models' Mega Stones did nothing), the bench lists only the three
  # Pokémon brought (poke-env kept all six from team preview), and the opponent's line says how many are still to come.
  c3:   # retired 10 Oct: failed answers played the default move at once, and the recent turns left out failed moves,
        # lost turns and what caused a boost (see c4)
    format: "gen9championsrotomarenabssregmb"
    team_mode: "draft"
    pick: 3
    profile: "ladder"
    thinking_budget: 1024
    max_output_tokens: 2048
    draft_max_output_tokens: 5120
    thinking_exceptions:
      muse_spark_1_3: "minimal"
    provider_routing:
      deepseek_v4_1_flash: ["Fireworks", "Novita", "DeepInfra", "Together"]

  # Rotom Champ Bench as played now: c3's rules, plus a failed answer (empty, unreadable, cut off or naming an illegal
  # action) gets one more try told what was wrong (in c3 it played the default move: 13% of Gemini's and Solar's turns),
  # the recent turns list failed moves, lost turns, Protect, Mega Evolution and what caused each stat change (DeepSeek
  # kept using a Sucker Punch that kept failing), and twice the thinking (Luna Pro, Haiku and Solar hit 1,024 on about
  # half their turns; Solar ran out of room before answering).
  c4:
    format: "gen9championsrotomarenabssregmb"
    team_mode: "draft"
    pick: 3
    profile: "ladder"
    thinking_budget: 2048
    max_output_tokens: 4096
    draft_max_output_tokens: 5120
    answer_attempts: 2
    battle_state: 2
    thinking_exceptions:
      muse_spark_1_3: "medium"   # 10 Oct: was minimal (~250 of 2,048 tokens); medium ~1,400. Only its games replay
    provider_routing:
      deepseek_v4_1_flash: ["Fireworks", "Novita", "DeepInfra", "Together"]
      # Our own key (BYOK) only: Bedrock or Vertex would bill OpenRouter credits once the plan's API credits run out
      claude_sonnet_5_5: ["Anthropic"]
      claude_opus_5_5: ["Anthropic"]
    agent_versions:
      pokechamp: 3   # 11 Oct: v2 ability immunities, no switching that only delays a knockout; v3 status moves (Protect, setup, hazards, healing, status)
  # c5 (plan: docs/plan-c5.md), to be played in the simulator once c4 ends. Medium effort for everyone (decided 12
  # Oct): 50% of an 8,192-token cap, so budget-based models (Claude) get a 4,096 ceiling and effort-based ones
  # (GPT-6, Gemini) medium. Battle state 3: plainly stated task and answer format, notes as memory, cache order.
  c5:
    format: "gen9championsrotomarenabssregmb"
    team_mode: "draft"
    pick: 3
    profile: "ladder"
    reasoning: "medium"
    # 13 Oct: a 4,096-token thinking budget for everyone (c1-c4's way: the same ceiling for all), instead of medium
    # effort, which providers read their own way (Sonnet thought 0 tokens, some spiralled to the cap). Effort-based
    # providers turn the number back into an effort level; models it doesn't work for get an exception below.
    # Earlier games of the models it changes are tagged "superseded:medium-effort" and retire later (see plan-c5.md).
    thinking_budget: 4096
    max_output_tokens: 8192
    draft_max_output_tokens: 8192
    answer_attempts: 2
    battle_state: 3
    notes_shown: 3
    draft_prompts: 2
    drafts: 3
    thinking_exceptions:
      # 12 Oct: at medium effort Sonnet 5.5 never thought (0 tokens in 85 turns); the 4,096-token budget medium means
      # for Claude, asked for directly, makes it think. (The default since 13 Oct; kept so its games stay current.)
      claude_sonnet_5_5: 4096
      # 13 Oct: Gemini 4 Argon barely thinks at medium or any budget (0-160 tokens); high effort makes it think
      # (200-1,650), about what other models do at the default
      gemini_4_argon: "high"
      # 13 Oct: at medium effort Qwen3.8 Flash thought to the 8,192 cap on every replayed c5 turn (4 of its first 7
      # turns cut off); asked for 4,096 tokens it thought 477-3,669
      qwen3_8_flash: 4096
      # 13 Oct: MiniMax M3 at medium spiralled now and then (2 of 23 c5 turns cut off; replayed turns 5,666 and
      # 8,192 tokens); asked for 4,096 it thought 589-3,099
      minimax_m3: 4096
    provider_routing:
      deepseek_v4_1_flash: ["Fireworks", "Novita", "DeepInfra", "Together"]
      # Our own key (BYOK) only: Bedrock or Vertex would bill OpenRouter credits once the plan's API credits run out
      claude_sonnet_5_5: ["Anthropic"]
      claude_opus_5_5: ["Anthropic"]
      claude_fable_5_1: ["Anthropic"]
    agent_versions:
      pokechamp: 4   # 12 Oct: damaging moves listed first (ties mean attacking); Sucker Punch fails against status moves

# The benchmark families the site presents like SWE-bench's: each has its own page and leaderboard tab.
# The site's price tiers, by cost per game in the main benchmark: a fixed edge, or a reference model (the edge
# between two reference tiers is halfway, geometrically, between their models' costs; a tier whose model hasn't
# played isn't shown). Free = costs nothing (local models, free tiers).
price_tiers:
  # 14 Oct: fixed round edges, each 4-5x the last (reference models moved: Sonnet got cheaper with caching and fell
  # out of the tier named after it)
  - {name: "free"}
  - {name: "pocket change", under: 0.002}
  - {name: "cheap", under: 0.01}
  - {name: "mid", under: 0.05}
  - {name: "expensive", under: 0.2}
  - {name: "very expensive"}

benches:
  - id: "rotom-champ-bench"
    title: "Rotom Champ Bench"
    tagline: "Pokémon Champions singles, Regulation M-B: level 50, bring six and pick three, the team each model built."
    description: "Pokémon Champions singles under Regulation M-B, the rules of the game's ranked Battle Stadium Singles. Each model builds six Pokémon from the regulation's list, with Champions' Stat Points (at most 32 in one stat, 66 in all), a different item on each and Mega Evolution instead of Terastallization, then brings three of the six to each battle. Everyone fights at level 50, and games are short."
  - id: "rotom-gen9-bench"
    title: "Rotom Gen9 Bench"
    tagline: "Gen 9 OverUsed singles on Pokémon Showdown: six Pokémon each, level 100, the team each model built."
    description: "Full Gen 9 OverUsed singles, the most played competitive format on Pokémon Showdown. Each model plays the team it built itself from the format's rules: six Pokémon at level 100, with Terastallization. Its variants are the same format with two fixed teams for everyone (s1), and the retired first version of team building (s2)."
  - id: "rotom-bw-bench"
    title: "Rotom BW Bench"
    tagline: "Coming later."
    description: "Reserved for the next benchmark."
    status: "coming"

# The benchmarks the site ranks. Each lists the ruleset versions whose games count; a version id names exact rules,
# stored in data/rulesets/<version>.json on its first run (change a rule and the next run demands a new version).
# Boards are generated: Overall (every benchmark), one per category once there are several, and one per benchmark.
benchmarks:
  - id: "gen9ou-own-teams"
    title: "Gen 9 OU · own teams"
    bench: "rotom-gen9-bench"
    category: "Pokémon"
    description: "Each model plays the Gen 9 OverUsed team it built itself: six Pokémon from the legal list, then their sets from their legal abilities and moves."
    versions: ["s4"]
  - id: "gen9ou-fixed-teams"
    title: "Gen 9 OU · fixed teams"
    bench: "rotom-gen9-bench"
    category: "Pokémon"
    description: "Every pairing plays the same two Gen 9 OverUsed teams from both sides; teambuilding not measured."
    versions: ["s1"]
    archived: true
  - id: "gen9ou-own-teams-v1"
    title: "Gen 9 OU · own teams (v1)"
    bench: "rotom-gen9-bench"
    category: "Pokémon"
    description: "The first own-teams version (retired): teams drafted in one step from the legal Pokémon list alone, so most models were judged on remembering movepools."
    versions: ["s2"]
    archived: true

  - id: "champions-bss-own-teams"
    title: "Champions BSS Reg M-B · own teams"
    bench: "rotom-champ-bench"
    category: "Pokémon"
    description: "Pokémon Champions singles under Regulation M-B: each model builds six from the regulation's list, with Champions' Stat Points and Mega Stones, and brings three of them to each battle."
    versions: ["c5"]   # public from 13 Oct (c4 archived below)
    anchor: "gpt_oss_20b"   # local open weights, plays early and often (Bonsai plays last: c4 had no ratings for hours)
  - id: "champions-bss-own-teams-c4"
    title: "Champions BSS · own teams (c4)"
    bench: "rotom-champ-bench"
    category: "Pokémon"
    description: "The fourth Champions version (retired 13 Oct): models saw the last few turns instead of the whole battle log, kept no notes from turn to turn, built one team instead of three, and thought within 2,048 tokens."
    versions: ["c4"]
    anchor: "gpt_oss_20b"
    archived: true
  - id: "champions-bss-own-teams-c3"
    title: "Champions BSS · own teams (c3)"
    bench: "rotom-champ-bench"
    category: "Pokémon"
    description: "The third Champions version (retired): a failed answer played the default move at once, the recent turns left out failed moves, lost turns and what caused a boost, and thinking stopped at 1,024 tokens."
    versions: ["c3"]
    archived: true
  - id: "champions-bss-own-teams-c2"
    title: "Champions BSS · own teams (c2)"
    bench: "rotom-champ-bench"
    category: "Pokémon"
    description: "The second Champions version (retired): models could not Mega Evolve (only the random bot could), and their bench listed the three Pokémon left at home."
    versions: ["c2"]
    archived: true
  - id: "champions-bss-own-teams-c1"
    title: "Champions BSS · own teams (c1)"
    bench: "rotom-champ-bench"
    category: "Pokémon"
    description: "The first Champions version (retired after 24 games): the battle prompt didn't say the Pokémon are level 50, and DeepSeek's thinking was cut off by providers that ignore the budget."
    versions: ["c1"]
    archived: true

# Ratings: Bradley-Terry on the Elo scale, anchored to one registry entry.
ladder:
  anchor: "bonsai_2_27b"    # fixed at anchor_rating; every placement plays it
  anchor_rating: 1500
  # Slow local models (about 25 s a turn): their pairs play after every other pair, the anchor's included, so the
  # quick games fill the rankings first. Ratings appear once the anchor has played.
  play_last: ["bonsai_2_27b", "ornith_1_5_35b_a3b"]
  # Played even past a paid model's game cap (the games still count toward it): GPT-6 Luna writing its answers
  # against GPT-6 Luna answering with probabilities, the same model family both ways (added 9 Oct, about $0.03)
  cap_exempt_pairs:
    - ["gpt_6_luna_pro", "gpt_6_luna_decisions"]
  best_of_three:
    s4: [["gpt_6_luna_pro", "gpt_6_luna_decisions"]]   # 1-1 after the first two: the video needs a decider
  games_per_set: 4          # 2 teams x 2 sides
  # A version's check run: each model plays this many games, all against free opponents (anchor, PokéChamp, chimps);
  # raised once they check out (13 Oct: c5 started at 2, then 9; lifted that night, its own caps and pairings rule)
  ceiling: {}
  parallel_games: 4         # games of a set played at once; local servers batch them (GPT-OSS 2.4x, Qwen 1.6x)
  provisional_games: 16     # a full placement
  max_autopilot: 0.5        # a match is void when either side fell back on more than half its turns
  bootstrap_samples: 1000
  control_games: 3          # vs Random AI, first in placement
  control_max_cost_per_game_usd: 2.0   # pricier models skip them unless --with-control

# Local models: RotomArena runs `gen llm serve/stop` itself before each series.
local_llm:
  gen: "D:/docs/assets/generator/gen.py"
  manage: true
  ctx: 12288   # tokens per slot (x ladder.parallel_games): c5 prompts grow to ~6,000 by turn 20, plus 4,096 of thinking

# Built-in providers: openrouter (default), local (llama.cpp on :8080), gemini, ollama, vllm (:8001).
# Entries here override or extend them, e.g.:
# providers:
#   local:
#     base_url: "http://127.0.0.1:8080/v1"
#     api_key: "local"
#     api_style: "llama.cpp"
#     default_model: "bonsai"

# Model registry. `battle --p1 <config id>` and the ladder use these entries.
# role: anchor (fixed reference), sparring (free standing opponent) or contestant (default).
