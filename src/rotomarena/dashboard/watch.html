<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching __TITLE__</title>
<style>
  :root { --bg: #04060e; --text: #e7ecff; --dim: #9aa5c9; --cyan: #3ee6ff; --line: rgba(120, 150, 255, 0.2); color-scheme: dark; }
  html body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Inter', system-ui, 'Segoe UI', sans-serif; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .top a { color: var(--cyan); }
  .top b { font-size: 1.05rem; }
  #live { color: var(--dim); font-size: 0.9rem; }
  .replay-scroll { overflow-x: auto; padding: 12px 0; }
  .replay-wrapper { min-width: 640px; max-width: 1180px; margin: 0 auto; }
</style>
</head>
<body class="dark">
<div class="top">
  <a href="../">← Run monitor</a>
  <b>__TITLE__</b>
  <span id="live">Connecting…</span>
</div>
<div class="replay-scroll">
  <div class="wrapper replay-wrapper">
    <div class="battle"></div>
    <div class="battle-log"></div>
    <div class="replay-controls"></div>
    <div class="replay-controls-2"></div>
  </div>
</div>
<script>
  // As in the site's ReplayEmbed: Showdown's routes must exist before replay-embed.js runs, and its effect images
  // need absolute URLs, or they resolve to this server.
  window.Config = window.Config || {};
  window.Config.routes = {root: 'pokemonshowdown.com', client: 'play.pokemonshowdown.com', dex: 'dex.pokemonshowdown.com', replays: 'replay.pokemonshowdown.com'};
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || img.dataset.retried) return;
    img.dataset.retried = 'true';
    var file = (img.getAttribute('src') || '').split('/').pop().split('?')[0];
    if (file && file.endsWith('.png')) img.src = 'https://play.pokemonshowdown.com/fx/' + file;
  }, true);
  (function () {
    var fxBase = 'https://play.pokemonshowdown.com/fx/';
    var timer = setInterval(function () {
      if (window.Dex) {
        if (!String(window.Dex.fxPrefix || '').startsWith('http')) window.Dex.fxPrefix = fxBase;
        if (!String(window.Dex.resourcePrefix || '').startsWith('http')) window.Dex.resourcePrefix = 'https://play.pokemonshowdown.com/';
      }
      if (window.BattleEffects) {
        for (var id in window.BattleEffects) {
          var fx = window.BattleEffects[id];
          if (fx && fx.url && !fx.url.startsWith('http') && !fx.url.startsWith('//')) fx.url = fxBase + fx.url.replace(/^\/?(fx\/)?/, '');
        }
      }
    }, 50);
    setTimeout(function () { clearInterval(timer); }, 15000);
  })();
</script>
<script type="text/plain" class="battle-log-data">__LOG__</script>
<script src="https://play.pokemonshowdown.com/js/replay-embed.js"></script>
<script>
  var room = __ROOM_JSON__;
  var next = __COUNT__;
  var live = document.getElementById('live');
  function pinDark() { document.body.classList.add('dark'); }
  window.addEventListener('load', pinDark);

  function whenReady(cb) {
    var t = setInterval(function () {
      if (window.Replays && window.Replays.battle) { clearInterval(t); cb(window.Replays.battle); }
    }, 200);
  }

  whenReady(function (battle) {
    pinDark();
    battle.seekTurn(Infinity);  // jump to the current turn, then play what arrives
    battle.play();
    var ended = false;
    async function poll() {
      try {
        var r = await fetch('../api/battle/' + encodeURIComponent(room) + '?from=' + next, {cache: 'no-store'});
        var d = await r.json();
        d.lines.forEach(function (line) { battle.add(line); });
        next += d.lines.length;
        ended = d.ended;
        live.textContent = (ended ? 'Battle over' : '● Live') + ' · turn ' + (battle.turn || 0) + ' · ' + new Date().toLocaleTimeString();
      } catch (e) {
        live.textContent = 'Lost the monitor; retrying…';
      }
      if (!ended) setTimeout(poll, 2000);
    }
    poll();
  });
</script>
</body>
</html>
