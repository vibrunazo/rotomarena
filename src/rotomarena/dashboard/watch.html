<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching __TITLE__</title>
<style>
  :root { --bg: #04060e; --text: #e7ecff; --dim: #9aa5c9; --cyan: #3ee6ff; --line: rgba(120, 150, 255, 0.2); color-scheme: dark; }
  html body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Inter', system-ui, 'Segoe UI', sans-serif; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .top a { color: var(--cyan); }
  .top b { font-size: 1.05rem; }
  #live { color: var(--dim); font-size: 0.9rem; }
  .replay-scroll { overflow-x: auto; padding: 12px 0; }
  .replay-wrapper { min-width: 640px; max-width: 1180px; margin: 0 auto; }
  .thoughts { max-width: 1180px; margin: 0 auto; padding: 4px 16px 40px; }
  .thoughts h2 { font: 700 0.95rem/1.2 'Rajdhani', 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 8px 0; }
  .turn-block { border-top: 1px solid var(--line); padding: 10px 0; }
  .turn-label { color: var(--dim); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .decisions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: 10px 20px; margin-top: 6px; }
  .who { font-weight: 600; }
  .side { color: var(--dim); font-size: 0.78rem; margin-left: 4px; }
  .act { color: var(--cyan); font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 0.85rem; }
  .meta { color: var(--dim); font-size: 0.8rem; }
  .thought { margin: 4px 0 0; white-space: pre-wrap; font-size: 0.92rem; }
  .flag { color: #ffb547; font-size: 0.8rem; }
  #nothoughts { color: var(--dim); font-size: 0.9rem; }
  .battle .picon.brought { border-radius: 50%; box-shadow: 0 0 0 2px #f6c945; opacity: 1 !important; }
</style>
</head>
<body class="dark">
<div class="top">
  <a href="../">← Run monitor</a>
  <b>__TITLE__</b>
  <span id="live">Connecting…</span>
</div>
<div class="replay-scroll">
  <div class="wrapper replay-wrapper">
    <div class="battle"></div>
    <div class="battle-log"></div>
    <div class="replay-controls"></div>
    <div class="replay-controls-2"></div>
  </div>
</div>
<section class="thoughts">
  <h2>Thoughts, newest first</h2>
  <p id="nothoughts">Each player's thought appears here as soon as it decides (games started before this feature have none).</p>
  <div id="thoughts"></div>
</section>
<script>
  // As in the site's ReplayEmbed: Showdown's routes must exist before replay-embed.js runs, and its effect images
  // need absolute URLs, or they resolve to this server.
  window.Config = window.Config || {};
  window.Config.routes = {root: 'pokemonshowdown.com', client: 'play.pokemonshowdown.com', dex: 'dex.pokemonshowdown.com', replays: 'replay.pokemonshowdown.com'};
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || img.dataset.retried) return;
    img.dataset.retried = 'true';
    var file = (img.getAttribute('src') || '').split('/').pop().split('?')[0];
    if (file && file.endsWith('.png')) img.src = 'https://play.pokemonshowdown.com/fx/' + file;
  }, true);
  (function () {
    var fxBase = 'https://play.pokemonshowdown.com/fx/';
    var timer = setInterval(function () {
      if (window.Dex) {
        if (!String(window.Dex.fxPrefix || '').startsWith('http')) window.Dex.fxPrefix = fxBase;
        if (!String(window.Dex.resourcePrefix || '').startsWith('http')) window.Dex.resourcePrefix = 'https://play.pokemonshowdown.com/';
      }
      if (window.BattleEffects) {
        for (var id in window.BattleEffects) {
          var fx = window.BattleEffects[id];
          if (fx && fx.url && !fx.url.startsWith('http') && !fx.url.startsWith('//')) fx.url = fxBase + fx.url.replace(/^\/?(fx\/)?/, '');
        }
      }
    }, 50);
    setTimeout(function () { clearInterval(timer); }, 15000);
  })();
</script>
<script type="text/plain" class="battle-log-data">__LOG__</script>
<script src="https://play.pokemonshowdown.com/js/replay-embed.js"></script>
<script>
  // Ring the Pokémon each player brought (bring-N formats). Showdown keeps the picks hidden until each switches
  // in, so they come from our own records: {username: [species ids, the lead first]}.
  window.markBrought = function (picks) {
    function id(s) { return String(s || '').toLowerCase().replace(/\s*\(.*$/, '').replace(/[^a-z0-9]/g, ''); }
    function apply() {
      document.querySelectorAll('.battle .trainer').forEach(function (trainer) {
        var name = ((trainer.querySelector('strong') || {}).textContent || '').trim();
        var ids = picks[name] || [];
        trainer.querySelectorAll('.picon').forEach(function (icon) {
          var label = id(icon.getAttribute('aria-label') || icon.title);
          // a base name before the forme is revealed (Rotom for Rotom-Wash), a longer one after Mega Evolving
          var brought = !!label && ids.some(function (x) { return x.indexOf(label) === 0 || label.indexOf(x) === 0; });
          if (icon.classList.contains('brought') !== brought) icon.classList.toggle('brought', brought);
        });
      });
    }
    apply();
    var battle = document.querySelector('.battle');
    if (battle && !battle.dataset.ringed) {
      battle.dataset.ringed = '1';
      new MutationObserver(function () { window.markBrought.refresh(); }).observe(battle, {childList: true, subtree: true});
    }
    window.markBrought.refresh = apply;
  };
  var picks = {};  // username -> the species it brought, from its team preview decision
  var room = __ROOM_JSON__;
  var next = __COUNT__;
  var tnext = 0;
  var decisions = [];

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function sides() {  // username -> "p1" / "p2", from the log's |player| lines
    var out = {};
    ((window.Replays && Replays.battle && Replays.battle.stepQueue) || []).forEach(function (l) {
      var m = /^\|player\|(p[12])\|([^|]+)/.exec(l);
      if (m) out[m[2]] = m[1];
    });
    return out;
  }
  function action(a) {
    var m = /^\/choose (move|switch) (.+)$/.exec(a || '');
    if (m) return (m[1] === 'switch' ? 'switch to ' : '') + m[2];
    m = /lead=(.+)$/.exec(a || '');
    return m ? 'lead ' + m[1] : a;
  }
  function renderThoughts() {
    if (!decisions.length) return;
    document.getElementById('nothoughts').style.display = 'none';
    var side = sides(), byTurn = {};
    decisions.forEach(function (d) { (byTurn[d.turn] = byTurn[d.turn] || []).push(d); });
    var turns = Object.keys(byTurn).map(Number).sort(function (a, b) { return b - a; });
    document.getElementById('thoughts').innerHTML = turns.map(function (t) {
      return '<div class="turn-block"><div class="turn-label">' + (t === 0 ? 'Team preview' : 'Turn ' + t) + '</div><div class="decisions">' +
        byTurn[t].map(function (d) {
          var flag = d.source !== 'model' ? ' <span class="flag">▲ ' + esc(d.source.replace('_', ' ')) + ': default move</span>' : '';
          return '<div><span class="who">' + esc(d.player) + '</span><span class="side">' + esc(side[d.player] || '') + '</span> · <span class="act">' +
            esc(action(d.action)) + '</span>' + flag + '<div class="meta">' + (d.seconds ? d.seconds + ' s' : '') +
            (d.thinking_tokens ? ' · ' + d.thinking_tokens + ' thinking tokens' : '') + '</div><p class="thought">' + (d.thought ? esc(d.thought) : '<span class="meta">(no thought written)</span>') + '</p></div>';
        }).join('') + '</div></div>';
    }).join('');
  }
  var live = document.getElementById('live');
  function pinDark() { document.body.classList.add('dark'); }
  window.addEventListener('load', pinDark);

  function whenReady(cb) {
    var t = setInterval(function () {
      if (window.Replays && window.Replays.battle) { clearInterval(t); cb(window.Replays.battle); }
    }, 200);
  }

  whenReady(function (battle) {
    pinDark();
    battle.seekTurn(Infinity);  // jump to the current turn, then play what arrives
    battle.play();
    var ended = false;
    async function poll() {
      try {
        var r = await fetch('../api/battle/' + encodeURIComponent(room) + '?from=' + next + '&tfrom=' + tnext, {cache: 'no-store'});
        var d = await r.json();
        d.lines.forEach(function (line) { battle.add(line); });
        next += d.lines.length;
        if (d.thoughts.length) {
          decisions = decisions.concat(d.thoughts); tnext += d.thoughts.length; renderThoughts();
          decisions.forEach(function (x) {
            var m = x.turn === 0 && /bring=(\S+)/.exec(x.action || '');
            if (m) picks[x.player] = m[1].split(',');
          });
          window.markBrought(picks);
        }
        ended = d.ended;
        live.textContent = (ended ? 'Battle over' : '● Live') + ' · turn ' + (battle.turn || 0) + ' · ' + new Date().toLocaleTimeString();
      } catch (e) {
        live.textContent = 'Lost the monitor; retrying…';
      }
      if (!ended) setTimeout(poll, 2000);
    }
    poll();
  });
</script>
</body>
</html>
