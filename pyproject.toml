[project]
name = "rotomarena"
version = "0.1.0"
description = "Local Pokémon AI battle benchmarking testbed integrating PokéChamp, Pokémon Showdown, and LLMs for Gen 9 OU"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RotomArena AI Team" }
]
dependencies = [
    "poke-env>=0.6.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
rotomarena = "rotomarena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotomarena"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
