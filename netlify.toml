# The site is a static Astro build of exported ladder data (site/src/data). Netlify never runs games.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Rebuild only when the site or its data changed, not on harness-only commits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/arxiv"
  to = "/paper/"
  status = 301
