# The site moved to rotomarena.org, on Cloudflare Workers, on 17 Oct 2026 (site/wrangler.jsonc). Netlify only redirects the old address
# there, page for page: netlify-redirect/_redirects, published as is, with no build. It redeploys only when that
# folder changes.
[build]
  base = "netlify-redirect"
  publish = "."
  command = "echo redirect only"
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
