# The site is a static Astro build of exported ladder data (site/src/data). Netlify never runs games.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Rebuild only when the site or its data changed, not on harness-only commits. On the first build both refs are
  # the same commit, which would read as "no changes", so that one always builds (exit 1 = build).
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/arxiv"
  to = "/paper/"
  status = 301

# A benchmark's page is its leaderboard (/benchmarks/<bench>/). The old leaderboard addresses of the current boards
# point there; the pages Astro builds for them redirect too, after 2 s, wherever these don't apply.
[[redirects]]
  from = "/leaderboard/"
  to = "/benchmarks/rotom-champ-bench/"
  status = 301
  force = true

[[redirects]]
  from = "/leaderboard/champions-bss-own-teams/"
  to = "/benchmarks/rotom-champ-bench/"
  status = 301
  force = true

[[redirects]]
  from = "/leaderboard/gen9ou-own-teams/"
  to = "/benchmarks/rotom-gen9-bench/"
  status = 301
  force = true
